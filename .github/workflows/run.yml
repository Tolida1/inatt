name: Inattv JSON Generator

on:
  schedule:
    - cron: "*/4 * * * *"   # 4 dakikada bir
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repo checkout
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerekli paketler
        run: pip install requests beautifulsoup4

      - name: JSON üret
        run: python pygoals.py

      - name: SSH key hazırla
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: JSON'u sunucuya gönder
        run: |
          scp -P ${{ secrets.SSH_PORT }} inattv.json \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:public_html/1/inattv.json
