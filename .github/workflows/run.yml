name: Inattv JSON Generator

on:
  schedule:
    - cron: "*/1 * * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Paketleri kur
        run: |
          pip install requests beautifulsoup4

      - name: Scripti çalıştır
        run: |
          python pygoals.py

      - name: Değişiklik varsa commit et
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add inattv.json
          git diff --cached --quiet || git commit -m "Auto update inattv.json"

    - name: Push
  run: |
    git pull --rebase
    git push
