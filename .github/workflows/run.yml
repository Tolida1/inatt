name: Inattv JSON Generator

on:
  schedule:
    - cron: "*/4 * * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run scraper
        run: python pygoals.py

      - name: Upload inattv.json via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 82.29.189.156
          port: 65002
          username: u719601221
          password: ...Mert...123...
          source: "inattv.json"
          target: "/home/u719601221/public_html/"
          overwrite: true
