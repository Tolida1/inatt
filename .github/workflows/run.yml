name: Inattv JSON Generator

on:
  schedule:
    - cron: "*/3 * * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests beautifulsoup4

      - name: Run script
        run: python pygoals.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add inattv.json
          git diff --cached --quiet || git commit -m "Auto update inattv.json"

      - name: Pull & Push
        run: |
          git pull --rebase
          git push
