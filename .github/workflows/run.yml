name: Inattv JSON Generator

on:
  schedule:
    - cron: "*/4 * * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests beautifulsoup4

      - name: Run script
        run: python pygoals.py

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY_B64 }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 65002 82.29.189.156 >> ~/.ssh/known_hosts

      - name: Upload JSON to server
        run: |
          scp -P 65002 inattv.json u719601221@82.29.189.156:/home/u719601221/public_html/1/inattv.json
